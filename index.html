<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155C3D">
<title>Equipe Gerador — DMA</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Equipe Gerador">
<style>
:root{
  --verde:#155C3D; --verde-esc:#0E4630; --verde-cl:#E8F1ED;
  --vermelho:#C0392B; --vermelho-cl:#FDECEA;
  --ambar:#B7791F; --ambar-cl:#FEF5E7;
  --cinza:#6B7280; --linha:#E2E5E9; --fundo:#F5F6F7; --papel:#fff; --texto:#1A1D21;
  --raio:12px; --sombra:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:var(--fundo);color:var(--texto);overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}

/* ---------- cabeçalho ---------- */
header{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;line-height:1.25;min-width:0}
header h1 span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo{height:30px;width:auto;border-radius:5px;flex:none;display:block}
header h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn-voltar{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;
  border-radius:9px;font-size:19px;line-height:1;cursor:pointer;flex:none}
#rede{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.18);flex:none}
#rede.off{background:#7A2E22}

main{padding:14px;padding-bottom:calc(96px + var(--safe-b));max-width:760px;margin:0 auto}

/* ---------- blocos ---------- */
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio);
  padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.cartao.clicavel{cursor:pointer}
.cartao.clicavel:active{transform:scale(.995)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza);
   margin:22px 0 10px;font-weight:700}
h2:first-child{margin-top:4px}
label.campo{display:block;margin-bottom:14px}
label.campo > span{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border:1px solid #CBD2D9;border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde);outline-offset:-1px;border-color:var(--verde)}
textarea{min-height:76px;resize:vertical}

/* ---------- botões ---------- */
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--verde);
  color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:active{background:var(--verde-esc)}
.btn[disabled]{background:#A8B3BD;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn.perigo{background:#fff;color:var(--vermelho);border:1.5px solid var(--vermelho)}
.btn.pq{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
.barra-baixo{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);
  border-top:1px solid var(--linha);padding:10px 14px calc(10px + var(--safe-b));
  backdrop-filter:blur(8px)}
.barra-baixo .interno{max-width:760px;margin:0 auto;display:flex;gap:10px}

/* ---------- progresso ---------- */
.progresso{height:5px;background:var(--linha);border-radius:3px;overflow:hidden;margin-bottom:4px}
.progresso i{display:block;height:100%;background:var(--verde);transition:width .25s}
.prog-txt{font-size:12px;color:var(--cinza);text-align:center;margin-bottom:8px}

/* ---------- item do checklist ---------- */
.item{background:var(--papel);border:1px solid var(--linha);border-left:3px solid var(--linha);
  border-radius:var(--raio);padding:14px;margin-bottom:11px}
.item.respondido{border-left-color:var(--verde)}
.item.pendente-obrig{border-left-color:var(--ambar)}
.item.nao-conforme{border-left-color:var(--vermelho);background:var(--vermelho-cl)}
.item .enunciado{font-weight:600;margin-bottom:3px;font-size:15px}
.item .meta{font-size:11px;color:var(--cinza);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.04em}
.tag.critica{background:var(--vermelho-cl);color:var(--vermelho)}
.tag.alta{background:var(--ambar-cl);color:var(--ambar)}
.tag.media{background:#EEF2F7;color:#4B5563}
.tag.foto{background:var(--verde-cl);color:var(--verde)}

/* ---------- opções lado a lado ---------- */
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes button{flex:1 1 auto;min-width:84px;padding:11px 10px;border:1.5px solid #CBD2D9;
  background:#fff;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500}
.opcoes button[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
.opcoes button.ruim[aria-pressed=true]{background:var(--vermelho);border-color:var(--vermelho)}
.opcoes button.na[aria-pressed=true]{background:var(--cinza);border-color:var(--cinza)}

/* ---------- fotos ---------- */
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.miniatura{position:relative;width:74px;height:74px;border-radius:9px;overflow:hidden;border:1px solid var(--linha)}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block}
.miniatura button{position:absolute;top:2px;right:2px;width:21px;height:21px;border-radius:50%;
  border:0;background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
.add-foto{width:74px;height:74px;border:1.5px dashed #B4BCC5;border-radius:9px;background:#FAFBFC;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;color:var(--cinza);font-size:10px;text-align:center;padding:4px}
.add-foto span:first-child{font-size:19px;line-height:1}
.add-foto.exigida{border-color:var(--ambar);color:var(--ambar);background:var(--ambar-cl)}

/* ---------- listas ---------- */
.linha-lista{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--papel);
  border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:9px;cursor:pointer;box-shadow:var(--sombra)}
.linha-lista .cresce{flex:1;min-width:0}
.linha-lista .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-lista .s{font-size:12.5px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-excluir{flex:none;width:31px;height:31px;border-radius:8px;border:1px solid var(--linha);
  background:#fff;color:var(--cinza);font-size:14px;cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.btn-excluir:active{background:var(--vermelho-cl);color:var(--vermelho);border-color:#F3C0BA}
.pilula{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;flex:none;text-transform:uppercase}
.pilula.rascunho{background:var(--ambar-cl);color:var(--ambar)}
.pilula.pronta{background:var(--verde-cl);color:var(--verde)}
.vazio{text-align:center;color:var(--cinza);padding:34px 16px;font-size:14.5px}
.vazio .ico{font-size:40px;margin-bottom:8px;opacity:.45}
.status-central{text-align:center;color:var(--cinza);font-size:12px;padding:14px 12px 4px;line-height:1.5}
.status-central .versao{margin-top:4px;font-weight:600;color:#4b5563}
.atalhos{display:flex;gap:10px;margin-bottom:14px}
.atalhos .btn{flex:1;padding:12px 8px;font-size:14px}
.atalhos .btn b{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--verde);color:#fff;font-size:12px}
.aviso{background:var(--ambar-cl);border:1px solid #F0D9A8;color:#7A5312;padding:11px 13px;
  border-radius:9px;font-size:13.5px;margin-bottom:12px}
.aviso.erro{background:var(--vermelho-cl);border-color:#F3C0BA;color:#8C2A1E}
.linha-lista.desabilitada{opacity:.42;filter:grayscale(.3)}

/* ---------- dados técnicos já cadastrados da loja ---------- */
.item.bloqueado{border-left-color:var(--verde);background:var(--verde-cl)}
.item.bloqueado .valor-fixo{font-size:14.5px;font-weight:600;color:#374151;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag.cadastrado{background:#fff;color:var(--verde)}
.link-acao{display:block;width:100%;text-align:left;background:none;border:0;color:var(--verde);
  font-size:12.5px;font-weight:600;padding:0 2px 16px;cursor:pointer;text-decoration:underline}

/* ---------- relatório ---------- */
#relatorio{background:#fff;padding:20px;font-size:13px}
#relatorio h3{margin:0 0 3px;font-size:17px;color:var(--verde)}
#relatorio .rsub{color:var(--cinza);font-size:12px;margin-bottom:14px}
#relatorio table{width:100%;border-collapse:collapse;margin-bottom:14px}
#relatorio th,#relatorio td{border:1px solid var(--linha);padding:6px 8px;text-align:left;
  vertical-align:top;font-size:12px}
#relatorio th{background:var(--verde-cl);font-weight:700;width:46%}
#relatorio .secao-rel{background:#EEF2F7;font-weight:700;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;padding:5px 8px;border:1px solid var(--linha);border-bottom:0}
#relatorio .nc{color:var(--vermelho);font-weight:700}
#relatorio .fotos-rel{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
#relatorio .fotos-rel img{width:104px;height:104px;object-fit:cover;border:1px solid var(--linha);border-radius:5px}
/* folha de impressão: @page sem margem tira o cabeçalho/rodapé do navegador (URL, data, título);
   as margens de cada página vêm do thead/tfoot da tabela .folha, que o Chrome repete em toda página */
#relatorio table.folha{width:100%;border-collapse:collapse;margin-bottom:0}
#relatorio .folha td.topo,#relatorio .folha td.rodape{height:0;padding:0;border:0}
#relatorio .folha td.miolo{padding:0;border:0;vertical-align:top}
@media print{
  @page{margin:0}
  header,.barra-baixo,.nao-imprime{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  #relatorio{padding:0}
  #relatorio .folha td.topo,#relatorio .folha td.rodape{height:12mm}
  #relatorio .folha td.miolo{padding:0 12mm}
  #relatorio table{page-break-inside:auto}
  #relatorio tr{page-break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <button class="btn-voltar oculto" id="btnVoltar" aria-label="Voltar">‹</button>
  <img id="logo" src="logo.png" alt="DMA">
  <h1 id="tituloTela"><span>Equipe Gerador</span><small>Grupo DMA</small></h1>
  <span id="rede">online</span>
</header>

<main id="tela"></main>
<div class="barra-baixo oculto" id="barra"><div class="interno" id="barraInterno"></div></div>

<script src="app.js"></script>
</body>
</html>
